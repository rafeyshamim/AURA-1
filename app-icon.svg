<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="goldSphere" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#fffbe6"/>
      <stop offset="25%" stop-color="#ffd449"/>
      <stop offset="55%" stop-color="#f5b041"/>
      <stop offset="85%" stop-color="#b7791f"/>
      <stop offset="100%" stop-color="#744210"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5b041" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f5b041" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="220" fill="url(#goldGlow)"/>

  <!-- Energy Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#f5b041" stroke-width="3" stroke-dasharray="10 15" opacity="0.4"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffeaa7" stroke-width="2" opacity="0.6"/>

  <!-- Golden Sphere -->
  <circle cx="256" cy="256" r="130" fill="url(#goldSphere)" filter="url(#glow)"/>

  <!-- Specular Highlight -->
  <ellipse cx="215" cy="195" rx="35" ry="22" fill="#ffffff" opacity="0.8" transform="rotate(-30 215 195)"/>
</svg>
